[project]
name = "mail"
version = "0.1.0"
description = "ARC business plugin: multi-account, multi-provider email delivery"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
]

[project.entry-points."arc.plugins"]
mail = "mail:register"

[project.entry-points."arc.plugins.cli"]
mail = "mail.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail"]
